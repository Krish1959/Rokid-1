<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InspectBot — Ship Walkway Safety Inspection</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <header class="app-header">
      <h1>🚢 InspectBot</h1>
      <p>Ship Walkway Safety Inspection Assistant</p>
      <button id="reportBtn" class="report-btn">⬇ Download Report (.md)</button>
    </header>

    <main id="chatWindow" class="chat-window"></main>

    <form id="chatForm" class="chat-form">
      <div id="previewRow" class="preview-row"></div>
      <div class="input-row">
        <label class="attach-btn" for="imageInput" title="Attach photo evidence">📷</label>
        <input type="file" id="imageInput" accept="image/*" multiple hidden />
        <textarea id="textInput" placeholder="Type your finding or reply..." rows="1"></textarea>
        <button type="submit" id="sendBtn">Send</button>
      </div>
    </form>
  </div>

  <script src="app.js"></script>
</body>
</html>
